; ============================================================
; OpenClash / subconverter 自定义规则
;
; 订阅结构：
;
; GROUPID=0
;   = 第一个订阅
;   = 大流量机场【主】
;
; PROVIDER=按流量机场
;   = 第二个订阅
;   = 按流量机场【备用】
;
; 第三个 wwnet 订阅已经删除，不参与任何策略。
;
; ============================================================
;
; 核心原则：
;
; 1. ChatGPT / OpenAI
;    美国节点
;    大流量机场优先
;    大流量机场整体不可用时才切换按流量机场
;
; 2. Gemini
;    新加坡节点
;    大流量机场优先
;    大流量机场整体不可用时才切换按流量机场
;
; 3. Google
;    新加坡节点
;    大流量机场优先
;    大流量机场整体不可用时才切换按流量机场
;
; 4. YouTube
;    香港 / 台湾 / 日本 / 新加坡 / 美国
;    大流量机场优先
;    大流量机场整体不可用时才切换按流量机场
;
; 5. 普通地区组
;    每个地区：
;    主机场 → url-test
;    备用机场 → url-test
;    外层 → fallback
;
;    即：
;    主机场内部自动选最快节点
;    主机场整体不可用才进入备用机场
;
; 6. Claude
;    ★★★ 特殊组 ★★★
;    美国节点
;    GROUPID=0 + 按流量机场
;    仅手动选择
;    不测速
;    不 fallback
;    不自动切换
;
; ============================================================

